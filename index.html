<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tanks</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="game"></div>

    <div id="hud" hidden>
      <div id="invite-panel" class="panel" hidden>
        <span class="panel-label">Invite</span>
        <span id="invite-code" class="invite-code"></span>
        <button id="invite-copy" type="button">Copy link</button>
      </div>
      <div id="status-panel" class="panel"></div>
      <div id="round-timer" class="panel"></div>
      <div id="scoreboard"></div>
      <div id="event-feed"></div>
      <div id="respawn-notice" hidden></div>
      <div id="results" hidden>
        <h2 id="results-title"></h2>
        <table id="results-table"></table>
        <div id="results-next-map"></div>
        <div id="results-countdown"></div>
      </div>
      <div id="loadout">
        <div id="powerup-bar"></div>
        <div id="weapon-bar"></div>
      </div>
    </div>

    <form id="menu" class="screen" hidden>
      <h1>Tanks</h1>
      <label class="field">
        <span>Your name</span>
        <input id="menu-name" maxlength="16" autocomplete="nickname" required />
      </label>
      <button id="menu-host" type="button" class="chunky go">Host a game</button>
      <div class="divider">or join one</div>
      <div class="join-row">
        <input id="menu-code" placeholder="Join code" maxlength="6" autocomplete="off" spellcheck="false" />
        <button id="menu-join" type="submit" class="chunky">Join</button>
      </div>
      <div class="field graphics-field">
        <span>Graphics</span>
        <div id="menu-graphics" class="pill-row"></div>
      </div>
    </form>

    <div id="lobby" class="screen" hidden>
      <div class="slab">
        <header class="slab-header">
          <h2>Lobby</h2>
          <span id="lobby-status" class="slab-status"></span>
          <div class="invite-chip">
            <span>Invite code</span>
            <strong id="lobby-code"></strong>
            <button id="lobby-copy" type="button" class="chunky small">Copy link</button>
          </div>
        </header>
        <div class="slab-body">
          <section class="squad">
            <h3>Players</h3>
            <ul id="lobby-players" class="player-list"></ul>
            <div id="lobby-add-bots" class="add-bots" hidden></div>
          </section>
          <section id="lobby-settings" class="settings"></section>
        </div>
        <footer class="slab-footer">
          <div id="lobby-controls" class="controls-guide"></div>
          <button id="lobby-leave" type="button" class="chunky">Leave</button>
          <button id="lobby-start" type="button" class="chunky go">Start game</button>
        </footer>
      </div>
    </div>

    <div id="game-menu" class="screen" hidden>
      <div class="slab">
        <header class="slab-header">
          <h2>Menu</h2>
          <span class="slab-status">The game keeps going while this is open. Esc to close.</span>
          <div class="graphics-chip">
            <span>Graphics</span>
            <div id="game-menu-graphics" class="pill-row"></div>
          </div>
        </header>
        <div class="slab-body">
          <section class="squad">
            <h3>Players</h3>
            <ul id="game-menu-players" class="player-list"></ul>
            <div id="game-menu-add-bots" class="add-bots" hidden></div>
          </section>
          <section class="settings">
            <p id="game-menu-settings-note" class="settings-note"></p>
            <div id="game-menu-settings"></div>
          </section>
        </div>
        <footer class="slab-footer">
          <div id="game-menu-controls" class="controls-guide"></div>
          <button id="game-menu-leave" type="button" class="chunky danger">Leave game</button>
          <button id="game-menu-end" type="button" class="chunky danger">End game</button>
          <button id="game-menu-close" type="button" class="chunky go">Back to game</button>
        </footer>
      </div>
    </div>

    <div id="notice" class="screen" hidden>
      <p id="notice-message"></p>
      <button id="notice-action" type="button" class="chunky go"></button>
    </div>

    <div id="warning-banner" hidden>
      <span id="warning-message"></span>
      <button id="warning-dismiss" type="button">Dismiss</button>
    </div>

    <div id="loading" class="screen">Loading…</div>
    <div id="build-version"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
