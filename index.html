<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tanks</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="game"></div>

    <div id="hud" hidden>
      <div id="invite-panel" class="panel" hidden>
        <span class="panel-label">Invite</span>
        <span id="invite-code" class="invite-code"></span>
        <button id="invite-copy" type="button">Copy link</button>
      </div>
      <div id="status-panel" class="panel"></div>
      <div id="round-timer" class="panel"></div>
      <div id="scoreboard"></div>
      <div id="event-feed"></div>
      <div id="respawn-notice" hidden></div>
      <div id="results" hidden>
        <h2 id="results-title"></h2>
        <table id="results-table"></table>
        <div id="results-countdown"></div>
      </div>
      <div id="loadout">
        <div id="powerup-bar"></div>
        <div id="weapon-bar"></div>
      </div>
      <div id="help">WASD / arrows to move · mouse to aim · click to fire · 1–7 or wheel to switch · hold to charge grenades</div>
    </div>

    <form id="menu" class="screen" hidden>
      <h1>Tanks</h1>
      <label class="field">
        <span>Your name</span>
        <input id="menu-name" maxlength="16" autocomplete="nickname" required />
      </label>
      <button id="menu-host" type="button" class="primary">Host a game</button>
      <div class="divider">or join one</div>
      <div class="join-row">
        <input id="menu-code" placeholder="Join code" maxlength="6" autocomplete="off" spellcheck="false" />
        <button id="menu-join" type="submit">Join</button>
      </div>
    </form>

    <div id="lobby" class="screen" hidden>
      <div class="card">
        <h2>Lobby</h2>
        <div class="lobby-invite">
          <span class="panel-label">Invite</span>
          <span id="lobby-code" class="invite-code"></span>
          <button id="lobby-copy" type="button" class="small">Copy link</button>
        </div>
        <div class="card-columns">
          <section>
            <h3>Players</h3>
            <ul id="lobby-players" class="player-list"></ul>
          </section>
          <section>
            <h3>Settings</h3>
            <div id="lobby-settings"></div>
          </section>
        </div>
        <div class="card-actions">
          <span id="lobby-status"></span>
          <button id="lobby-leave" type="button">Leave</button>
          <button id="lobby-start" type="button" class="primary">Start game</button>
        </div>
      </div>
    </div>

    <div id="game-menu" class="screen" hidden>
      <div class="card">
        <h2>Menu</h2>
        <div id="game-menu-host" class="card-columns">
          <section>
            <h3>Players</h3>
            <ul id="game-menu-players" class="player-list"></ul>
          </section>
          <section>
            <h3>Settings <small>(from the next round)</small></h3>
            <div id="game-menu-settings"></div>
          </section>
        </div>
        <div class="card-actions">
          <span class="menu-hint">Esc to close</span>
          <button id="game-menu-leave" type="button" class="danger">Leave game</button>
          <button id="game-menu-end" type="button" class="danger">End game</button>
          <button id="game-menu-close" type="button" class="primary">Back to game</button>
        </div>
      </div>
    </div>

    <div id="notice" class="screen" hidden>
      <p id="notice-message"></p>
      <button id="notice-action" type="button" class="primary"></button>
    </div>

    <div id="warning-banner" hidden>
      <span id="warning-message"></span>
      <button id="warning-dismiss" type="button">Dismiss</button>
    </div>

    <div id="loading" class="screen">Loading…</div>
    <div id="build-version"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
